<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>양서고 영어 내신 대비 완전정복 가이드 | 이든X학원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --blueprint:#2D4468;
    --blueprint-deep:#182338;
    --parchment:#F6F3EA;
    --paper:#FCFAF4;
    --gold:#B4872E;
    --gold-light:#E8D5A8;
    --slate:#5B6B82;
    --crimson:#8C3B3B;
    --rule:#D8D1BF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:800px;
    margin:0 auto;
    background:var(--paper);
    box-shadow:0 0 0 1px var(--rule);
  }

  /* ---------- HERO ---------- */
  .hero{
    background:linear-gradient(155deg, var(--blueprint) 0%, var(--blueprint-deep) 100%);
    color:#EDE9DD;
    padding:56px 48px 44px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 32px);
    pointer-events:none;
  }
  .hero-inner{position:relative;}
  .hero-tag{
    font-size:14px;
    color:var(--gold-light);
    font-weight:500;
    margin:0 0 18px;
    letter-spacing:0.02em;
  }
  .hero h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:32px;
    line-height:1.45;
    margin:0 0 16px;
    color:#FBF9F2;
  }
  .hero p.lead{
    font-size:15.5px;
    color:#C9D2DE;
    max-width:56ch;
    margin:0;
  }
  .hero-meta{
    display:flex;
    gap:28px;
    margin-top:32px;
    padding-top:24px;
    border-top:1px solid rgba(232,213,168,0.25);
    flex-wrap:wrap;
  }
  .hero-meta div{font-size:13px;color:#A9B6C6;}
  .hero-meta strong{display:block;color:#EDE9DD;font-size:14.5px;font-weight:600;margin-bottom:3px;}

  /* ---------- BODY ---------- */
  .content{padding:8px 48px 12px;}
  section{padding:40px 0;border-bottom:1px solid var(--rule);}
  section:last-of-type{border-bottom:none;}

  h2.section-title{
    font-family:'Noto Serif KR', serif;
    font-size:23px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 6px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  h2.section-title .mark{
    display:inline-block;
    width:10px;height:10px;
    background:var(--gold);
    border-radius:1px;
    transform:rotate(45deg);
    flex:none;
  }
  .section-sub{
    font-size:14px;
    color:var(--slate);
    margin:0 0 28px;
  }

  /* grade cards */
  .grade-block{
    margin-bottom:28px;
    border-left:3px solid var(--blueprint);
    padding-left:22px;
  }
  .grade-block.grade-2{border-left-color:var(--gold);}
  .grade-block h3{
    font-size:17px;
    font-weight:700;
    color:var(--blueprint);
    margin:0 0 4px;
  }
  .grade-block.grade-2 h3{color:#8C6A1E;}
  .grade-block .composition{
    font-size:13.5px;
    color:var(--slate);
    margin:0 0 14px;
    line-height:1.6;
  }
  .grade-block .composition b{color:var(--ink);font-weight:600;}
  .point-list{margin:0;padding:0;list-style:none;}
  .point-list li{
    position:relative;
    padding-left:20px;
    margin-bottom:12px;
    font-size:14.5px;
    color:#33405A;
  }
  .point-list li::before{
    content:"";
    position:absolute;
    left:0;top:9px;
    width:6px;height:6px;
    background:var(--blueprint);
    border-radius:50%;
  }
  .grade-block.grade-2 .point-list li::before{background:var(--gold);}
  .point-list li b{color:var(--ink);font-weight:600;}
  .point-list .sub{
    margin-top:8px;
    margin-left:2px;
    font-size:13.5px;
    color:var(--slate);
  }
  .point-list .sub div{margin-bottom:4px;}

  /* intro / report overview */
  .intro-block{padding:40px 0 34px;border-bottom:1px solid var(--rule);}
  .intro-block h2{
    font-family:'Noto Serif KR', serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 16px;
    line-height:1.5;
  }
  .intro-block .rule{
    width:44px;height:3px;background:var(--gold);
    margin:0 0 18px;
  }
  .intro-block p{
    font-size:15px;
    color:#33405A;
    margin:0;
    line-height:1.85;
  }

  /* core structure (3 pillars) */
  .core-grid{display:flex;flex-direction:column;gap:26px;}
  .core-item{display:grid;grid-template-columns:38px 1fr;gap:16px;}
  .core-num{
    width:34px;height:34px;border-radius:50%;
    background:var(--blueprint);color:#EDE9DD;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif KR', serif;
    font-weight:700;font-size:15px;
    margin-top:2px;
  }
  .core-item h3{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 8px;}
  .core-item ul{margin:0;padding-left:18px;}
  .core-item ul li{font-size:14.5px;color:#33405A;margin-bottom:7px;}
  .core-item ul li b{color:var(--ink);font-weight:600;}

  /* sub headings inside analysis section */
  .subhead{
    font-size:15.5px;font-weight:700;color:var(--blueprint);
    margin:30px 0 14px;
    display:flex;align-items:center;gap:8px;
  }
  .subhead .circle{
    width:22px;height:22px;border-radius:50%;
    background:var(--gold);color:#2A2010;
    font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }

  /* vocab transform list */
  .vocab-list{list-style:none;margin:0 0 16px;padding:0;}
  .vocab-list li{
    display:grid;grid-template-columns:110px 1fr;gap:14px;
    padding:11px 0;border-bottom:1px dotted var(--rule);
    font-size:13.8px;color:#33405A;align-items:baseline;
  }
  .vocab-list li:last-child{border-bottom:none;}
  .vocab-list .kor{font-weight:600;color:var(--ink);}
  .vocab-list .eng b{color:var(--blueprint);font-weight:600;}
  .vocab-list .eng .ant{color:var(--slate);font-size:12.3px;display:block;margin-top:2px;}
  .note-box{
    background:var(--parchment);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:16px 18px;
    font-size:13.8px;
    color:#33405A;
    margin-top:4px;
  }
  .note-box b{color:var(--ink);}

  /* difficulty spectrum */
  .diff-list{display:flex;flex-direction:column;gap:14px;margin-top:4px;}
  .diff-item{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start;}
  .diff-tag{
    font-size:12px;font-weight:700;padding:7px 8px;border-radius:2px;
    text-align:center;color:#fff;line-height:1.3;
  }
  .diff-1{background:#6E85A4;}
  .diff-2{background:var(--blueprint);}
  .diff-3{background:#8C6A1E;}
  .diff-4{background:var(--crimson);}
  .diff-item h4{margin:0 0 4px;font-size:14.5px;font-weight:700;color:var(--ink);}
  .diff-item p{margin:0;font-size:13.6px;color:#33405A;}

  /* strategy steps */
  .steps{counter-reset:step;}
  .step{
    display:grid;
    grid-template-columns:56px 1fr;
    gap:20px;
    padding:22px 0;
    border-top:1px dashed var(--rule);
  }
  .step:first-child{border-top:none;padding-top:6px;}
  .step-num{
    font-family:'Noto Serif KR', serif;
    font-size:30px;
    font-weight:700;
    color:var(--gold);
    line-height:1;
    padding-top:2px;
  }
  .step h3{
    font-size:16.5px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 8px;
  }
  .step p, .step ul{
    font-size:14.5px;
    color:#33405A;
    margin:0 0 6px;
  }
  .step ul{padding-left:18px;margin-top:8px;}
  .step ul li{margin-bottom:6px;}
  .step ul li b{color:var(--crimson);font-weight:600;}

  .time-table{
    margin-top:14px;
    border:1px solid var(--rule);
    border-radius:2px;
    overflow:hidden;
  }
  .time-row{
    display:grid;
    grid-template-columns:110px 1fr;
    border-top:1px solid var(--rule);
  }
  .time-row:first-child{border-top:none;}
  .time-row .tlabel{
    background:var(--blueprint);
    color:#EDE9DD;
    font-size:13px;
    font-weight:600;
    padding:12px 14px;
    display:flex;
    align-items:center;
  }
  .time-row .tdesc{
    padding:12px 16px;
    font-size:13.5px;
    color:#33405A;
    display:flex;
    align-items:center;
  }

  /* summary callout */
  .callout{
    background:var(--blueprint-deep);
    color:#EDE9DD;
    border-radius:3px;
    padding:32px 34px;
    margin-top:10px;
    position:relative;
  }
  .callout::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:4px;
    background:var(--gold);
  }
  .callout h3{
    font-family:'Noto Serif KR', serif;
    font-size:18px;
    margin:0 0 12px;
    color:#F3E8CB;
  }
  .callout p{
    font-size:14.5px;
    color:#C9D2DE;
    margin:0 0 10px;
    line-height:1.85;
  }
  .callout p:last-child{margin-bottom:0;}
  .callout b{color:#F3E8CB;font-weight:600;}

  /* footer */
  footer{
    background:var(--ink);
    color:#AEB8CA;
    padding:36px 48px;
    font-size:12.5px;
    line-height:1.9;
  }
  footer .foot-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    padding-bottom:18px;
    border-bottom:1px solid rgba(174,184,202,0.2);
    margin-bottom:16px;
  }
  footer .brand{
    font-family:'Noto Serif KR', serif;
    font-size:16px;
    font-weight:700;
    color:#F6F3EA;
  }
  footer .brand span{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-size:11.5px;
    font-weight:400;
    color:#8390A6;
    margin-top:4px;
  }
  footer .contact{text-align:right;color:#8FA1BE;}
  footer .copyright{color:#6E7A90;}

  @media (max-width:640px){
    .hero{padding:40px 22px 32px;}
    .content{padding:4px 22px 8px;}
    footer{padding:28px 22px;}
    .hero h1{font-size:25px;}
    .step{grid-template-columns:40px 1fr;gap:14px;}
    .step-num{font-size:24px;}
    footer .foot-top{flex-direction:column;}
    footer .contact{text-align:left;}
    .vocab-list li{grid-template-columns:1fr;gap:4px;}
    .diff-item{grid-template-columns:1fr;gap:8px;}
    .diff-tag{width:fit-content;}
  }

  @media print{
    body{background:#fff;}
    .page{box-shadow:none;}
    .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .callout{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .time-row .tlabel{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    footer{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    section{break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="page">
  <div class="content">
  <footer>
    <div class="foot-top">
      <div class="brand">이든X학원<span>이든관리형학습센터 · 학습관리 · 영어내신 · 수능지도</span></div>
      <div class="contact">하남시 미사강변대로 80 그린프라자 7층<br>문의 010-8442-2817</div>
    </div>
    <div class="copyright">본 자료는 이든X학원이 자체 분석·제작한 콘텐츠로, 무단 전재 및 재배포를 금합니다.<br>Copyright ⓒ 2026 이든X학원(Eden X Academy). All rights reserved.</div>
  </footer>

</div>
</body>
</html>
